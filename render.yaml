# Render Blueprint specification for Volmo Electric
# https://render.com/docs/blueprint-spec

services:
  # 1. Standalone Backend API Service (Root Directory: server)
  - type: web
    name: volmo-backend-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: NOTIFICATION_EMAIL
        value: piyushshivhare083@gmail.com
      - key: COMPANY_MAIL_FROM
        value: sales@volmoelectrical.com

  # 2. Unified Full-Stack Node Web Service (Root Directory: .)
  - type: web
    name: volmo-fullstack
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: NOTIFICATION_EMAIL
        value: piyushshivhare083@gmail.com
      - key: COMPANY_MAIL_FROM
        value: sales@volmoelectrical.com

  # 3. Static Site Frontend (Vite SPA) - Zero cost, CDN hosted on Render
  - type: static
    name: volmo-frontend
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
